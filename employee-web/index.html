<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Axzen Employee</title>
  <link rel="icon" href="assets/axzenPOS.png?v=2" type="image/png">
  <link rel="apple-touch-icon" href="assets/axzenPOS.png?v=2">
  <style>
    :root {
      --page: #f4f7fb;
      --surface: #ffffff;
      --surface-2: #eef4ff;
      --ink: #0f172a;
      --muted: #667085;
      --line: #e4eaf2;
      --brand: #0b5fe8;
      --brand-2: #0847b8;
      --green: #12805c;
      --green-soft: #e7f7ef;
      --amber: #b45309;
      --amber-soft: #fff4df;
      --red: #b42318;
      --red-soft: #fee8e5;
      --violet: #6d3bc2;
      --violet-soft: #f0eafd;
      --cyan: #087f8c;
      --cyan-soft: #e4f7fa;
      --shadow: 0 12px 28px rgba(15, 23, 42, .08);
      --radius: 16px;
      --app-safe-top: env(safe-area-inset-top, 0px);
      --app-safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    html.native-app { --app-safe-top: 32px; --app-safe-bottom: 12px; }

    * { box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background: #dfe7ef;
      color: var(--ink);
      font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 14px;
      line-height: 1.45;
      letter-spacing: 0;
    }

    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
    h1, h2, h3, p { margin: 0; }
    svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .hidden { display: none !important; }

    .screen {
      width: min(100%, 480px);
      min-height: 100dvh;
      margin: 0 auto;
      background: #f5f7fb;
      position: relative;
      overflow-x: hidden;
    }

    .login {
      display: grid;
      align-content: center;
      gap: 18px;
      padding: max(22px, calc(var(--app-safe-top) + 18px)) 22px max(22px, calc(var(--app-safe-bottom) + 18px));
      background:
        linear-gradient(180deg, rgba(11, 95, 232, .08), rgba(18, 128, 92, .08)),
        var(--page);
    }

    .brand {
      display: grid;
      gap: 10px;
    }
    .brand-mark {
      width: 52px;
      height: 52px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: #fff;
      background: var(--brand);
      font-size: 20px;
      font-weight: 900;
      box-shadow: 0 14px 28px rgba(10, 102, 194, .24);
    }
    .brand h1 {
      font-size: 30px;
      line-height: 36px;
      font-weight: 900;
    }
    .brand p {
      color: var(--muted);
      font-size: 14px;
      font-weight: 650;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
      padding: 16px;
      display: grid;
      gap: 14px;
    }

    .subtle-panel {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fbfcfe;
      padding: 13px;
      display: grid;
      gap: 10px;
    }

    .field {
      display: grid;
      gap: 6px;
      color: #344054;
      font-size: 12px;
      font-weight: 800;
    }
    input, select, textarea {
      width: 100%;
      min-height: 44px;
      border: 1px solid #cbd5e1;
      border-radius: var(--radius);
      padding: 10px 11px;
      background: #fff;
      color: var(--ink);
      outline: none;
    }
    textarea { min-height: 84px; resize: vertical; }
    input:focus, select:focus, textarea:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(10, 102, 194, .14);
    }

    .role-toggle, .chips, .actions {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .role-toggle::-webkit-scrollbar, .chips::-webkit-scrollbar, .actions::-webkit-scrollbar { display: none; }

    .chip {
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0 14px;
      background: #fff;
      color: #475467;
      font-size: 12px;
      font-weight: 850;
      white-space: nowrap;
    }
    .chip.active {
      background: var(--brand);
      border-color: var(--brand);
      color: #fff;
    }

    .btn {
      min-height: 44px;
      border: 0;
      border-radius: var(--radius);
      padding: 0 13px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--brand);
      color: #fff;
      text-decoration: none;
      font-weight: 850;
      white-space: nowrap;
    }
    .btn.small { min-height: 34px; padding: 0 10px; font-size: 12px; }
    .btn.soft { background: var(--surface-2); color: var(--brand); border: 1px solid #c9dcfb; }
    .btn.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); }
    .btn.green { background: var(--green); }
    .btn.amber { background: #d97706; }
    .btn.red { background: var(--red); }
    .btn:disabled { opacity: .58; cursor: not-allowed; }

    .status {
      min-height: 20px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }
    .status.error { color: var(--red); }
    .status.ok { color: var(--green); }

    .app {
      min-height: 100dvh;
      padding-bottom: calc(84px + var(--app-safe-bottom));
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 12;
      min-height: 72px;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      padding: calc(10px + var(--app-safe-top)) 16px 10px;
      border-bottom: 1px solid rgba(221, 227, 234, .9);
      background: rgba(255, 255, 255, .96);
      backdrop-filter: blur(14px);
    }
    .app.detail-mode .topbar {
      grid-template-columns: 46px minmax(0, 1fr) 46px;
    }
    .app.detail-mode .title-area {
      justify-content: center;
      text-align: center;
    }
    .app.detail-mode .title-text h1,
    .app.detail-mode .title-text p { text-align: center; }

    .title-area {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .title-mark {
      width: 92px;
      height: 38px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: #fff;
      color: var(--brand);
      border: 1px solid var(--line);
      font-weight: 950;
      overflow: hidden;
      box-shadow: 0 8px 18px rgba(15,23,42,.07);
    }
    .title-text { min-width: 0; }
    .title-text h1 {
      font-size: 22px;
      line-height: 27px;
      font-weight: 900;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .title-text p {
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .icon-btn {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: #eaf2ff;
      color: var(--brand);
      box-shadow: none;
      position: relative;
    }
    .notify-dot {
      position: absolute;
      top: 8px;
      right: 9px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #2563eb;
      box-shadow: 0 0 0 2px #eaf2ff;
    }
    .icon-btn.is-idle { visibility: hidden; pointer-events: none; }
    .lucide-icon {
      display: block;
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .bottom-nav .lucide-icon { width: 24px; height: 24px; }
    .btn .lucide-icon,
    .lead-action .lucide-icon { width: 20px; height: 20px; }

    main {
      display: grid;
      gap: 12px;
      padding: 12px;
    }

    .hero {
      display: grid;
      gap: 14px;
      border-radius: var(--radius);
      padding: 18px;
      background: linear-gradient(135deg, #0a66c2, #12805c);
      color: #fff;
      box-shadow: 0 18px 36px rgba(10, 102, 194, .22);
    }
    .hero h2 {
      font-size: 19px;
      line-height: 25px;
      font-weight: 900;
    }
    .hero p { color: rgba(255,255,255,.84); font-weight: 700; }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .section-head h2 {
      font-size: 16px;
      line-height: 22px;
      font-weight: 900;
    }
    .muted { color: var(--muted); font-size: 12px; font-weight: 700; }

    .metrics {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .metrics.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .metric {
      min-height: 78px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      padding: 12px;
    }
    .metric strong {
      display: block;
      color: var(--brand);
      font-size: 20px;
      line-height: 25px;
      font-weight: 950;
      overflow-wrap: anywhere;
    }
    .metric span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
      line-height: 15px;
      font-weight: 800;
    }

    .list { display: grid; gap: 10px; }
    .row {
      min-width: 0;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      padding: 13px;
    }
    .row.stack { grid-template-columns: 1fr; }
    .row.clickable { cursor: pointer; }
    .row h3 {
      font-size: 14px;
      line-height: 20px;
      font-weight: 900;
      overflow-wrap: anywhere;
    }
    .row p {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      line-height: 17px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .pill {
      min-height: 25px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 9px;
      background: var(--surface-2);
      color: var(--brand);
      font-size: 11px;
      line-height: 13px;
      font-weight: 900;
      white-space: nowrap;
    }
    .pill.green { background: var(--green-soft); color: var(--green); }
    .pill.amber { background: var(--amber-soft); color: var(--amber); }
    .pill.red { background: var(--red-soft); color: var(--red); }
    .pill.violet { background: var(--violet-soft); color: var(--violet); }
    .pill.cyan { background: var(--cyan-soft); color: var(--cyan); }

    .form {
      display: grid;
      gap: 11px;
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .full { grid-column: 1 / -1; }

    .kv-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }
    .kv {
      min-height: 60px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fbfcfe;
      padding: 10px;
    }
    .kv span { display: block; color: var(--muted); font-size: 11px; font-weight: 800; }
    .kv strong { display: block; margin-top: 5px; font-weight: 900; overflow-wrap: anywhere; }

    .lead-hero {
      overflow: hidden;
      padding: 0;
      border: 0;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 10px 28px rgba(15,23,42,.08);
    }
    .lead-hero-top {
      min-height: 132px;
      display: grid;
      grid-template-columns: 96px minmax(0, 1fr);
      gap: 12px;
      align-items: center;
      position: relative;
      padding: 20px 16px 34px;
      background: linear-gradient(135deg, #004fb3, #0069d9 54%, #073c90);
      color: #fff;
    }
    .lead-avatar {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,.94);
      display: grid;
      place-items: center;
      background: #fff;
      color: #0b5fe8;
      font-size: 32px;
      font-weight: 950;
      box-shadow: 0 10px 22px rgba(0,0,0,.16);
    }
    .lead-hero-title { min-width: 0; display: grid; gap: 8px; padding-right: 112px; }
    .lead-hero-title h2 { font-size: 24px; line-height: 30px; font-weight: 950; overflow-wrap: anywhere; }
    .lead-hero-title p { color: rgba(255,255,255,.9); font-size: 15px; font-weight: 800; overflow-wrap: anywhere; }
    .lead-demo-pill { width: max-content; min-height: 28px; border-radius: 999px; padding: 4px 12px; background: #7c3aed; color: #fff; font-weight: 900; font-size: 11px; letter-spacing: .02em; }
    .lead-status-pill { position: absolute; right: 14px; top: 16px; border: 0; border-radius: 999px; background: #fff; color: #132238; padding: 7px 11px; font-size: 12px; font-weight: 850; white-space: nowrap; display: inline-flex; align-items: center; }
    .lead-status-dot { width: 10px; height: 10px; display: inline-block; border-radius: 50%; margin-right: 7px; background: #27b77a; }
    .lead-info-wrap {
      margin: -24px 12px 14px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 16px 42px rgba(15,23,42,.1);
    }
    .lead-info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .lead-info-card {
      min-height: 74px;
      border: 1px solid #edf1f7;
      border-radius: 14px;
      background: #fff;
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      padding: 10px;
      color: inherit;
      text-align: left;
    }
    .lead-info-icon {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: var(--brand);
      background: #eaf3ff;
    }
    .lead-info-card:nth-child(2) .lead-info-icon { color: #7c3aed; background: #f1e8ff; }
    .lead-info-card:nth-child(3) .lead-info-icon { color: #12805c; background: #e7f7ef; }
    .lead-info-card:nth-child(4) .lead-info-icon { color: #f97316; background: #fff1e7; }
    .lead-info-card span { color: var(--muted); font-size: 12px; font-weight: 800; }
    .lead-info-card strong { display: block; margin-top: 3px; font-size: 15px; font-weight: 950; overflow-wrap: anywhere; }
    .lead-action-grid { display: grid; grid-template-columns: repeat(6, minmax(76px, 1fr)); gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
    .lead-action-grid::-webkit-scrollbar { display: none; }
    .lead-action {
      min-width: 76px;
      min-height: 82px;
      border: 1px solid var(--line);
      border-radius: 16px;
      display: grid;
      place-items: center;
      gap: 6px;
      background: #fff;
      box-shadow: 0 8px 18px rgba(15,23,42,.05);
      font-size: 11px;
      font-weight: 850;
      color: #344054;
    }
    .lead-action.green { color: var(--green); background: #f2fbf7; border-color: #ccebdd; }
    .lead-action.amber { color: #ea580c; background: #fff7ed; border-color: #fed7aa; }
    .lead-action.violet { color: #7c3aed; background: #f7f1ff; border-color: #ddd6fe; }
    .lead-action.red { color: var(--red); background: #fff7f6; border-color: #f4c7c2; }
    .lead-actions-panel .btn { width: 100%; }
    .activity-card .row { border: 0; padding: 6px 0; grid-template-columns: 42px 1fr auto; }
    .last-activity .activity-line {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 36px;
      color: #344054;
      font-weight: 750;
    }
    .last-activity .activity-line svg { color: var(--brand); flex: 0 0 auto; }
    .last-activity .activity-line.phone svg { color: var(--green); }
    .last-activity .activity-line b { color: var(--brand); font-weight: 850; }
    .section-title-icon {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .timeline {
      display: grid;
      gap: 0;
      position: relative;
      padding-left: 4px;
    }
    .timeline-item {
      width: 100%;
      border: 0;
      background: transparent;
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) auto;
      gap: 10px;
      align-items: start;
      text-align: left;
      padding: 8px 0 14px;
      position: relative;
    }
    .timeline-item::before {
      content: "";
      position: absolute;
      left: 16px;
      top: 36px;
      bottom: 0;
      width: 2px;
      background: #dbe7f8;
    }
    .timeline-item:last-child::before { display: none; }
    .timeline-item.current h3 { color: var(--brand); }
    .timeline-item .muted-label { color: var(--muted); font-size: 12px; font-weight: 750; }
    .timeline-item .current-label { color: var(--brand); font-size: 12px; font-weight: 850; }
    .activity-dot {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #eaf3ff;
      color: var(--brand);
      font-weight: 950;
    }
    .account-card {
      overflow: hidden;
      padding: 0;
      background: #fff;
      border-radius: 14px;
      border: 1px solid #dfe6ef;
      box-shadow: 0 10px 22px rgba(15,23,42,.06);
    }
    .account-hero {
      display: grid;
      grid-template-columns: 94px minmax(0, 1fr) 122px;
      gap: 12px;
      align-items: center;
      min-height: 118px;
      padding: 18px 18px 16px 18px;
      background: linear-gradient(135deg, #045be7, #0754cf 62%, #0750bd);
      color: #fff;
    }
    .account-avatar {
      width: 82px;
      height: 82px;
      border-radius: 50%;
      border: 0;
      display: grid;
      place-items: center;
      background: #fff;
      color: #075bd8;
      font-size: 32px;
      font-weight: 950;
      box-shadow: 0 12px 26px rgba(0,0,0,.18);
    }
    .account-title { min-width: 0; }
    .account-title h2 { font-size: 22px; line-height: 27px; font-weight: 950; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .account-title p { color: rgba(255,255,255,.94); font-size: 14px; line-height: 20px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .account-edit {
      border: 1px solid rgba(255,255,255,.75);
      border-radius: 8px;
      min-height: 48px;
      padding: 0 10px;
      background: transparent;
      color: #fff;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 900;
      justify-self: end;
    }
    .account-edit svg {
      width: 21px;
      height: 21px;
      stroke-width: 2.3;
    }
    .account-status {
      width: max-content;
      min-height: 28px;
      padding: 0 13px;
      border-radius: 999px;
      border: 1px solid #bbf7d0;
      background: #ecfdf3;
      color: #027a48;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      font-weight: 850;
      margin-top: 8px;
    }
    .account-tabs {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      border-bottom: 1px solid var(--line);
      background: #fff;
    }
    .account-tabs button {
      min-height: 48px;
      border: 0;
      background: #fff;
      color: #475467;
      font-size: 13px;
      font-weight: 650;
      border-bottom: 3px solid transparent;
    }
    .account-tabs button.active { color: #005fe8; border-bottom-color: #005fe8; font-weight: 850; }
    .verify-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 14px 14px 16px; }
    .verify-pill {
      min-height: 38px;
      border: 1px solid #d6dee9;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: #fff;
      padding: 0 8px;
      font-size: 11px;
      font-weight: 750;
      color: var(--green);
      text-align: center;
    }
    .verify-pill.pending { color: #d97706; }
    .verify-mark {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: inline-grid;
      place-items: center;
      flex: 0 0 auto;
      background: #16a34a;
      color: #fff;
    }
    .verify-mark.pending { background: #f59e0b; }
    .verify-mark svg {
      width: 14px;
      height: 14px;
      stroke-width: 3;
    }
    .profile-card {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
      padding: 14px;
      box-shadow: 0 8px 20px rgba(15,23,42,.06);
      display: grid;
      gap: 12px;
    }
    .profile-card-head {
      display: grid;
      grid-template-columns: 40px minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
    }
    .profile-icon {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #eaf3ff;
      color: var(--brand);
    }
    .profile-map {
      min-height: 106px;
      border-radius: 10px;
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(45deg, transparent 48%, #dbe4ef 49%, #dbe4ef 51%, transparent 52%),
        linear-gradient(-45deg, transparent 48%, #dbe4ef 49%, #dbe4ef 51%, transparent 52%),
        #eef3f8;
      background-size: 42px 42px;
    }
    .profile-map::after {
      content: "";
      position: absolute;
      width: 22px;
      height: 22px;
      left: 58%;
      top: 38%;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      background: var(--brand);
      box-shadow: 0 6px 18px rgba(10,102,194,.35);
    }
    .work-location-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(190px, 1fr);
      gap: 14px;
      align-items: stretch;
    }
    .work-location-copy {
      display: grid;
      align-content: center;
      gap: 7px;
      padding-left: 44px;
    }
    .profile-detail-table { display: grid; gap: 7px; padding-left: 44px; }
    .profile-detail-row {
      display: grid;
      grid-template-columns: 160px minmax(0, 1fr);
      gap: 12px;
      color: #475467;
      font-size: 13px;
      line-height: 18px;
      font-weight: 500;
    }
    .profile-detail-row strong { color: #101828; font-size: 14px; font-weight: 500; overflow-wrap: anywhere; }
    .bank-head-actions { display: inline-flex; align-items: center; gap: 12px; }
    .plain-link {
      border: 0;
      background: transparent;
      color: #005fe8;
      font-weight: 850;
      padding: 0;
    }
    .payout-row {
      display: grid;
      grid-template-columns: 1fr 1fr minmax(150px, auto);
      gap: 10px;
      align-items: center;
      border-top: 1px dashed var(--line);
      padding-top: 12px;
    }
    .payout-row strong { display: block; font-size: 20px; font-weight: 950; }
    .printer-asset {
      min-height: 82px;
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr) auto 40px 24px;
      gap: 12px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px;
    }
    .printer-photo {
      width: 58px;
      height: 50px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: linear-gradient(160deg, #1f2937, #030712);
      color: #fff;
    }
    .qr-chip {
      width: 38px;
      height: 38px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: #111827;
      background: repeating-linear-gradient(90deg, #111 0 3px, #fff 3px 6px);
      font-size: 0;
    }
    .arrow-more { color: #475467; font-size: 30px; line-height: 1; }
    .profile-footer-actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
      overflow: hidden;
    }
    .profile-footer-actions button {
      min-height: 50px;
      border: 0;
      border-right: 1px solid var(--line);
      background: #fff;
      color: var(--brand);
      font-weight: 850;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .profile-footer-actions svg {
      width: 18px;
      height: 18px;
      stroke-width: 2.1;
    }
    .profile-footer-actions button:last-child { border-right: 0; color: var(--red); }
    .nav-btn[data-nav="add"].active::after { display: none; }
    .nav-btn[data-nav="add"] {
      transform: translateY(-18px);
      width: 62px;
      min-height: 62px;
      justify-self: center;
      border-radius: 50%;
      background: var(--brand);
      color: #fff;
      box-shadow: 0 12px 26px rgba(10,102,194,.28);
    }
    @media (max-width: 380px) {
      .lead-hero-top { grid-template-columns: 84px minmax(0, 1fr); }
      .lead-status-pill { position: static; grid-column: 1 / -1; justify-self: start; }
      .lead-hero-title { padding-right: 0; }
      .lead-info-grid { grid-template-columns: 1fr; }
      .account-hero { grid-template-columns: 78px minmax(0, 1fr); }
      .account-edit { grid-column: 1 / -1; justify-content: center; }
      .verify-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; padding-inline: 12px; }
      .verify-pill { min-height: 54px; padding: 6px; flex-direction: column; font-size: 12px; line-height: 14px; }
      .payout-row { grid-template-columns: 1fr; }
      .work-location-layout { grid-template-columns: 1fr; }
      .work-location-copy, .profile-detail-table { padding-left: 0; }
      .profile-detail-row { grid-template-columns: 1fr; gap: 2px; }
      .printer-asset { grid-template-columns: 62px minmax(0, 1fr) auto; }
      .qr-chip, .arrow-more { display: none; }
    }

    .bottom-nav {
      position: fixed;
      left: 50%;
      bottom: 0;
      z-index: 18;
      transform: translateX(-50%);
      width: min(100%, 480px);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
      padding: 8px 9px calc(8px + var(--app-safe-bottom));
      border-top: 1px solid var(--line);
      background: rgba(255,255,255,.98);
      backdrop-filter: blur(14px);
    }
    .nav-btn {
      min-height: 58px;
      border: 0;
      border-radius: var(--radius);
      display: grid;
      place-items: center;
      gap: 2px;
      background: transparent;
      color: #475467;
      font-size: 10px;
      line-height: 12px;
      font-weight: 850;
      position: relative;
    }
    .bottom-nav.manager { grid-template-columns: repeat(6, 1fr); }
    .nav-btn.active {
      background: transparent;
      color: var(--brand);
    }
    .nav-btn.active::after {
      content: "";
      position: absolute;
      top: 4px;
      width: 18px;
      height: 3px;
      border-radius: 99px;
      background: var(--brand);
    }
    .nav-btn { position: relative; }

    .sheet {
      position: fixed;
      inset: 0;
      z-index: 35;
      display: grid;
      align-items: end;
      background: rgba(15, 23, 42, .38);
      padding: 12px;
    }
    .sheet-card {
      width: min(100%, 456px);
      max-height: calc(100dvh - 40px);
      overflow-y: auto;
      margin: 0 auto;
      border-radius: var(--radius);
      background: #fff;
      box-shadow: 0 22px 54px rgba(15, 23, 42, .28);
      padding: 16px;
      display: grid;
      gap: 12px;
    }

    .empty {
      min-height: 130px;
      border: 1px dashed #cbd5e1;
      border-radius: var(--radius);
      display: grid;
      place-items: center;
      text-align: center;
      padding: 18px;
      color: var(--muted);
      font-weight: 750;
    }

    @media (max-width: 380px) {
      main { padding: 12px 10px; }
      .metrics.three { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .form-grid, .kv-grid { grid-template-columns: 1fr; }
      .btn { white-space: normal; text-align: center; }
    }
  </style>
</head>
<body>
  <section class="screen login" id="loginScreen">
    <div class="brand">
      <h1>Axzen Employee</h1>
      <p>Customer onboarding, approvals, payments, printers and team tracking in one clean workflow.</p>
    </div>
    <form class="panel" id="loginForm">
      <label class="field">Login ID <input id="loginId" autocomplete="username" required></label>
      <label class="field">Password <input id="password" type="password" autocomplete="current-password" required></label>
      <button class="btn" id="loginBtn" type="submit">Login</button>
      <div class="status" id="loginStatus">Enter your login details.</div>
    </form>
  </section>

  <section class="screen app hidden" id="appScreen">
    <header class="topbar">
      <button class="icon-btn is-idle" id="backBtn" type="button" aria-label="Back"><svg class="lucide-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
      <div class="title-area">
        <div class="title-mark" id="titleMark"><svg class="lucide-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 0 0-16 0"/></svg></div>
        <div class="title-text">
          <h1 id="pageTitle">Dashboard</h1>
          <p id="pageSub">Axzen employee workflow</p>
        </div>
      </div>
      <button class="icon-btn" id="notifyBtn" type="button" aria-label="Notifications"><svg class="lucide-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><span class="notify-dot"></span></button>
    </header>
    <main id="page"></main>
    <nav class="bottom-nav" id="tabs"></nav>
  </section>

  <div class="sheet hidden" id="sheet">
    <div class="sheet-card" id="sheetCard"></div>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    if (window.Capacitor) document.documentElement.classList.add("native-app");
    const liveApi = "https://canteen.axzen.in";
    const API = (window.Capacitor || location.protocol === "capacitor:") ? liveApi : "";
    const TOKEN_KEY = "axzen_employee_token";
    const USER_KEY = "axzen_employee_user";
    const DATA_CACHE_KEY = "axzen_employee_dashboard_cache";

    function lucideIcon(name, size = 22) {
      const paths = {
        house: '<path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/>',
        clipboardList: '<rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M9 12h6"/><path d="M9 16h6"/>',
        plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
        creditCard: '<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>',
        users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9"/><path d="M16 3.1a4 4 0 0 1 0 7.8"/>',
        chartNoAxesColumn: '<path d="M5 21V10"/><path d="M12 21V3"/><path d="M19 21v-6"/>',
        user: '<circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 0 0-16 0"/>',
        fileText: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8"/><path d="M8 17h6"/>',
        mapPin: '<path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="3"/>',
        building2: '<path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18"/><path d="M6 12H4a2 2 0 0 0-2 2v8h20v-8a2 2 0 0 0-2-2h-2"/><path d="M10 6h4"/><path d="M10 10h4"/><path d="M10 14h4"/><path d="M10 18h4"/>',
        printer: '<path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v8H6z"/>',
        landmark: '<path d="M3 22h18"/><path d="M6 18V9"/><path d="M10 18V9"/><path d="M14 18V9"/><path d="M18 18V9"/><path d="m12 2 9 5H3z"/>',
        check: '<path d="m20 6-11 11-5-5"/>',
        clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
        x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
        bell: '<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>',
        phone: '<path d="M22 16.9v3a2 2 0 0 1-2.2 2A19.8 19.8 0 0 1 3.1 5.2 2 2 0 0 1 5.1 3h3a2 2 0 0 1 2 1.7l.4 2.5a2 2 0 0 1-.6 1.8l-1.2 1.2a16 16 0 0 0 5.1 5.1l1.2-1.2a2 2 0 0 1 1.8-.6l2.5.4a2 2 0 0 1 1.7 2Z"/>',
        messageCircle: '<path d="M20 11.5a8 8 0 0 1-11.8 7L4 20l1.4-4.1A8 8 0 1 1 20 11.5Z"/>',
        playCircle: '<circle cx="12" cy="12" r="10"/><path d="m10 8 6 4-6 4Z"/>',
        shoppingBag: '<path d="M6 7h12l1 14H5Z"/><path d="M9 7a3 3 0 0 1 6 0"/>',
        helpCircle: '<circle cx="12" cy="12" r="10"/><path d="M9.5 9a3 3 0 1 1 4.8 2.4c-1 .7-1.8 1.3-1.8 2.6"/><path d="M12 18h.01"/>',
        logOut: '<path d="M10 17l5-5-5-5"/><path d="M15 12H3"/><path d="M21 3v18"/>',
        pencil: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
        qrCode: '<rect x="3" y="3" width="5" height="5"/><rect x="16" y="3" width="5" height="5"/><rect x="3" y="16" width="5" height="5"/><path d="M12 7h.01"/><path d="M12 12h4"/><path d="M12 16h.01"/><path d="M16 16h.01"/><path d="M21 12h.01"/><path d="M21 21h-5v-5"/>',
        chevronRight: '<path d="m9 18 6-6-6-6"/>',
        store: '<path d="m3 9 2-5h14l2 5"/><path d="M4 9v11h16V9"/><path d="M9 22V12h6v10"/>',
        shield: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
        activity: '<path d="M22 12h-4l-3 7-6-14-3 7H2"/>',
        userPlus: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6"/><path d="M22 11h-6"/>'
      };
      return `<svg class="lucide-icon" viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name] || paths.user}</svg>`;
    }

    const icons = {
      home: lucideIcon("house", 24),
      leads: lucideIcon("clipboardList", 24),
      plus: lucideIcon("plus", 24),
      rupee: lucideIcon("store", 24),
      store: lucideIcon("store", 24),
      shield: lucideIcon("shield", 24),
      users: lucideIcon("users", 24),
      chart: lucideIcon("chartNoAxesColumn", 24),
      plan: lucideIcon("fileText", 24),
      user: lucideIcon("user", 24)
    };

    const esc = value => String(value ?? "").replace(/[&<>"']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]));
    const money = value => "Rs " + Number(value || 0).toLocaleString("en-IN");
    const fmtDate = value => value ? new Date(value).toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" }) : "-";
    const fmtDateTime = value => {
      if (!value) return "";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return String(value);
      return date.toLocaleString("en-IN", { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
    };
    const mobileDigits = value => String(value || "").replace(/\D/g, "");
    const today = () => new Date().toISOString().slice(0, 10);

    let token = localStorage.getItem(TOKEN_KEY) || "";
    let user = readJson(USER_KEY);
    let route = "dashboard";
    let stack = [];
    let data = readJson(DATA_CACHE_KEY) || demoData();
    let selectedCanteenId = null;
    let busy = false;
    let filterStatus = "All";

    function readJson(key) {
      try { return JSON.parse(localStorage.getItem(key) || "null"); }
      catch { return null; }
    }

    function demoData() {
      const now = new Date().toISOString();
      return {
        canteens: [
          { id: 1001, canteenName: "Sri Lakshmi Foods", businessCategory: "Canteen", ownerName: "Ramesh Kumar", ownerMobile: "9876543210", city: "Hyderabad", state: "Telangana", counters: 2, printersRequired: 2, printersAssigned: 0, selectedPlan: "Professional", planType: "Paid", paidAmount: 12000, pendingAmount: 3000, paymentMode: "UPI", status: "Pending Approval", submittedBy: "MKT001", submittedByName: "Venkatesh", notes: "Needs printer and menu setup.", createdAt: now },
          { id: 1002, canteenName: "Metro Staff Canteen", businessCategory: "Restaurant", ownerName: "Saleem", ownerMobile: "9848012345", city: "Khammam", state: "Telangana", counters: 1, printersRequired: 1, printersAssigned: 1, selectedPlan: "Starter", planType: "Trial", paidAmount: 0, pendingAmount: 0, paymentMode: "Trial", status: "Trial", submittedBy: "MKT002", submittedByName: "Sravani", activatedCanteenId: "AXC-1002", canteenLoginId: "AXC1002", defaultPassword: "AXZEN1002", createdAt: now }
        ],
        users: [
          { employeeId: "MKT001", name: "Venkatesh", role: "marketing", active: true, target: 20 },
          { employeeId: "MKT002", name: "Sravani", role: "marketing", active: true, target: 18 }
        ],
        payments: [{ id: 1, canteenId: 1001, canteenName: "Sri Lakshmi Foods", amount: 12000, pendingAmount: 3000, paymentMode: "UPI", collectedByName: "Venkatesh", createdAt: now }],
        printers: [{ serialNumber: "AXP1001", model: "58mm Bluetooth", status: "Stock" }],
        enquiries: [],
        activities: [],
        summary: {
          cards: {
            totalCanteens: 2, activeCanteens: 0, trialCanteens: 1, expiredCanteens: 0, blockedCanteens: 0,
            todaysRegistrations: 1, todaysCollections: 12000, monthlyRevenue: 12000, pendingPayments: 3000,
            printersAssigned: 1, printersAvailable: 1, pendingInstallations: 1, totalEnquiries: 0, newEnquiries: 0
          },
          marketingPerformance: [
            { employeeId: "MKT001", name: "Venkatesh", registrations: 1, approved: 0, rejected: 0, collection: 12000, pending: 3000, target: 20 },
            { employeeId: "MKT002", name: "Sravani", registrations: 1, approved: 1, rejected: 0, collection: 0, pending: 0, target: 18 }
          ],
          recentActivities: []
        }
      };
    }

    async function api(path, options = {}) {
      const headers = { "Content-Type": "application/json", ...(options.headers || {}) };
      if (token) headers.Authorization = `Bearer ${token}`;
      const response = await fetch(`${API}${path}`, { ...options, headers });
      const body = await response.json().catch(() => ({}));
      if (!response.ok || body.success === false) throw new Error(body.message || "Server request failed");
      return body;
    }

    function isManager() {
      return user?.role === "super_admin" || user?.role === "manager";
    }

    function metric(label, value) {
      return `<div class="metric"><strong>${esc(value)}</strong><span>${esc(label)}</span></div>`;
    }

    function kv(label, value) {
      return `<div class="kv"><span>${esc(label)}</span><strong>${esc(value || "-")}</strong></div>`;
    }

    function pill(status) {
      const text = String(status || "New");
      const lower = text.toLowerCase();
      const tone = lower.includes("active") || lower.includes("paid") || lower.includes("approved") || lower.includes("trial") ? "green"
        : lower.includes("pending") || lower.includes("progress") ? "amber"
        : lower.includes("reject") || lower.includes("block") || lower.includes("expired") ? "red"
        : lower.includes("stock") || lower.includes("executive") ? "cyan"
        : "violet";
      return `<span class="pill ${tone}">${esc(text)}</span>`;
    }

    function setPage(title, sub) {
      $("pageTitle").textContent = title;
      $("pageSub").textContent = sub || (isManager() ? "Manager control center" : "Employee sales workflow");
      $("titleMark").innerHTML = lucideIcon(isManager() ? "users" : "user", 22);
      const detail = ["canteenDetail", "profile"].includes(route);
      $("appScreen").classList.toggle("detail-mode", detail);
      $("titleMark").classList.toggle("hidden", detail);
      $("backBtn").classList.toggle("is-idle", !detail && stack.length === 0);
      renderTabs();
    }

    function navItems() {
      return isManager()
        ? [["dashboard", icons.home, "Home"], ["canteens", icons.leads, "Leads"], ["approvals", icons.shield, "Approvals"], ["plans", icons.plan, "Plans"], ["team", icons.users, "Team"], ["profile", icons.user, "Profile"]]
        : [["dashboard", icons.home, "Home"], ["canteens", icons.leads, "Leads"], ["add", icons.plus, "Add"], ["payments", icons.store, "Customers"], ["profile", icons.user, "Profile"]];
    }

    function renderTabs() {
      $("tabs").classList.toggle("manager", isManager());
      $("tabs").innerHTML = navItems().map(([id, icon, label]) =>
        `<button class="nav-btn ${route === id ? "active" : ""}" type="button" data-nav="${id}">${icon}<span>${label}</span></button>`
      ).join("");
      document.querySelectorAll("[data-nav]").forEach(btn => btn.addEventListener("click", () => go(btn.dataset.nav)));
    }

    function go(next, push = true) {
      const roots = new Set(["dashboard", "canteens", "add", "payments", "profile", "approvals", "plans", "team", "reports"]);
      if (roots.has(next)) stack = [];
      else if (push && route !== next) stack.push(route);
      route = next;
      render();
      window.scrollTo({ top: 0, behavior: "instant" });
    }

    function bindRoutes(root = document) {
      root.querySelectorAll("[data-route]").forEach(el => el.addEventListener("click", () => {
        closeSheet();
        go(el.dataset.route);
      }));
      root.querySelectorAll("[data-canteen]").forEach(el => el.addEventListener("click", () => {
        selectedCanteenId = Number(el.dataset.canteen);
        go("canteenDetail");
      }));
    }

    async function refreshData({ silent = false } = {}) {
      if (!token) return;
      try {
        if (!silent) setBusy(true);
        const body = await api("/marketing-api/dashboard");
        data = body;
        localStorage.setItem(DATA_CACHE_KEY, JSON.stringify(data));
      } catch (error) {
        if (!silent) toast(error.message + ". Check your connection and try again.", "error");
      } finally {
        setBusy(false);
      }
    }

    function setBusy(next) {
      busy = next;
      document.querySelectorAll("button").forEach(btn => {
        if (btn.id !== "backBtn") btn.disabled = next;
      });
    }

    function toast(message, type = "ok") {
      const card = $("sheetCard");

    function currentRows() {

      if (filterStatus !== "All") rows = rows.filter(row => String(row.status || "").toLowerCase().includes(filterStatus.toLowerCase()));
      return rows;
    }

    function employeeRows() {
      let rows = Array.isArray(data.canteens) ? data.canteens : [];
      if (!isManager() && user?.employeeId) rows = rows.filter(row => String(row.submittedBy || "") === String(user.employeeId));
      return rows;
    }

    function dateKey(value) {
      if (!value) return "";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return String(value).slice(0, 10);
      return date.toISOString().slice(0, 10);
    }

    function isExpiredCustomer(item) {
      const status = String(item?.status || "").toLowerCase();
      if (status.includes("expired")) return true;
      // Trial/Active/Blocked status should not be reclassified as expired based on date alone
      if (status.includes("trial") || status.includes("active") || status.includes("blocked")) return false;
      if (!item?.planExpiryDate) return false;
      const expiry = new Date(`${String(item.planExpiryDate).slice(0, 10)}T23:59:59`);
      return !Number.isNaN(expiry.getTime()) && expiry < new Date();
    }

    function hasCustomerLogin(item) {
      return Boolean(item?.canteenLoginId || item?.activatedCanteenId);
    }

    function isPayingOrTrialCustomer(item) {
      if (!hasCustomerLogin(item) || isExpiredCustomer(item)) return false;
      const status = String(item?.status || "").toLowerCase();
      return status.includes("active") || status.includes("trial") || Number(item?.paidAmount || 0) > 0 || String(item?.paymentMode || "").toLowerCase().includes("success");
    }

    function customerRows() {
      return employeeRows().filter(isPayingOrTrialCustomer);
    }

    function leadRows() {
      return employeeRows().filter(item => !isPayingOrTrialCustomer(item));
    }

    function todayTaskRows() {
      const key = today();
      return employeeRows().filter(item => {
        const next = item.nextFollowUp || item.followUpDate || item.lastActivity?.followUpDate;
        return dateKey(next) === key || (Array.isArray(item.followUps) && item.followUps.some(row => dateKey(row.followUpDate || row.nextFollowUp) === key));
      });
    }

    function expiredRows() {
      return employeeRows().filter(isExpiredCustomer);
    }

    function daysUntilExpiry(item) {
      if (!item?.planExpiryDate) return null;
      const expiry = new Date(`${String(item.planExpiryDate).slice(0, 10)}T23:59:59`);
      if (Number.isNaN(expiry.getTime())) return null;
      return Math.ceil((expiry.getTime() - Date.now()) / 86400000);
    }

    function expiryFollowupRows() {
      return employeeRows().filter(item => {
        const days = daysUntilExpiry(item);
        return days !== null && days >= 0 && days <= 2;
      });
    }

    function planRows() {

        ? data.websitePlans

            { id: 2, name: "Growth", offerPrice: "799", billingCycle: "month", active: true },

      return rows.filter(row => row.active !== false);
    }

    function employeePayments() {

    function commissionRows() {
      const seen = new Set();
      return employeePayments()
        .filter(row => Number(row.amount || 0) > 0)
        .filter(row => {
          const key = Number(row.canteenId || 0);
          if (seen.has(key)) return false;
          seen.add(key);
          return true;
        })
        .map(row => {
          const canteen = (data.canteens || []).find(item => Number(item.id) === Number(row.canteenId));
          return { ...row, commission: Number(canteen?.commissionAmount ?? row.commissionAmount ?? Math.round(Number(row.amount || 0) * 0.1)) };
        });
    }

      return (data.printers || []).filter(row => {

    async function saveWorkflow(item, payload) {
      const fallback = { ...item, ...payload, status: payload.status || payload.stage || item.status };
      fallback.lastActivity = {
        type: payload.type,
        employeeId: user?.employeeId || user?.id || "-",
        outcome: payload.outcome || payload.stage || "",
        notes: payload.notes || "",
        followUpDate: payload.followUpDate || "",
        followUpTime: payload.followUpTime || "",
        createdAt: new Date().toISOString()
      };
      fallback.activityTimeline = [...timelineRows(item), fallback.lastActivity];
      try {
        setBusy(true);
        const body = await api(`/marketing-api/canteens/${item.id}/workflow`, { method: "POST", body: JSON.stringify(payload) });
        const index = data.canteens.findIndex(row => Number(row.id) === Number(item.id));
        if (index >= 0) data.canteens[index] = body.canteen;
        selectedCanteenId = body.canteen.id;
        await refreshData({ silent: true });
        closeSheet();
        renderDetail();
      } catch (error) {
        const index = data.canteens.findIndex(row => Number(row.id) === Number(item.id));
        if (index >= 0) data.canteens[index] = fallback;
        closeSheet();
        toast(`${error.message}. Saved on this device until sync is available.`, "error");
        renderDetail();
      } finally {
        setBusy(false);
      }
    }

        if (filterStatus === "Follow") return hay.includes("follow") || Boolean(row.nextFollowUp);

    async function submitCustomer(event) {
      event.preventDefault();
      const payload = {
        canteenName: $("canteenName").value.trim(),
        ownerName: $("ownerName").value.trim(),
        ownerMobile: $("ownerMobile").value.trim(),
        businessCategory: $("businessCategory").value,
        city: $("city").value.trim(),
        state: $("state").value.trim(),
        counters: Number($("counters").value || 1),
        printersRequired: 0,
        requestedPrinters: Number($("printersRequired").value || 0),
        selectedPlan: $("selectedPlan").value,
        planType: $("planType").value,
        demoDays: Number($("demoDays").value || 0),
        trialDays: $("planType").value === "Trial" ? Number($("demoDays").value || 0) : 0,
        paidAmount: Number($("paidAmount").value || 0),
        pendingAmount: Number($("pendingAmount").value || 0),
        paymentMode: $("paymentMode").value,
        planStartDate: $("planStartDate").value,
        menuSetupItems: $("menuSetupItems").value.split(/\n/).map(line => line.trim()).filter(Boolean).map(line => {
          const [name, price] = line.split(/\s*-\s*/);
          return { name: name || line, price: Number(price || 0) };
        }),
        address: $("address").value.trim(),
        notes: $("notes").value.trim()
      };
      try {
        setBusy(true);
        const body = await api("/marketing-api/canteens", { method: "POST", body: JSON.stringify(payload) });
        selectedCanteenId = body.canteen.id;
        await refreshData({ silent: true });
        toast("Customer submitted for manager approval.");
        go("canteenDetail");
      } catch (error) {
        toast(error.message, "error");
      } finally {
        setBusy(false);
      }
    }

    async function approveCanteen(id, overrides = {}) {
      try {

          <div class="profile-card-head"><span class="profile-icon">${profileIcon("printer")}</span><div><h2>Printers With Me</h2></div><div class="bank-head-actions">${pill(`${printers.length} Devices`)}<button class="plain-link" type="button">View all</button></div></div>
          <div class="list">${printers.length ? printers.map(row => `<article class="printer-asset"><span class="printer-photo">${profileIcon("printer")}</span><div><h3>${esc(row.serialNumber || row.assetId || "-")}</h3><p>${esc(row.model || "58mm Bluetooth Printer")}</p><p>Assigned ${fmtDate(row.assignedAt || row.createdAt || Date.now())}</p></div>${pill(row.status || "With Executive")}<button class="qr-chip" type="button" aria-label="QR">${lucideIcon("qrCode", 18)}</button><span class="arrow-more">${lucideIcon("chevronRight", 18)}</span></article>`).join("") : `<div class="empty">No printers currently with you.</div>`}</div>
          <button class="btn small soft" id="reportIssueBtn" type="button">Report Issue</button>
        </section>
        <section class="profile-card" id="personalCard">
          <div class="profile-card-head"><span class="profile-icon">${profileIcon("person")}</span><div><h2>Personal Details</h2></div><button class="plain-link" id="personalEditBtn" type="button">Edit</button></div>
          <div class="profile-detail-table">
            <div class="profile-detail-row"><span>Mobile</span><strong>${esc(user?.mobile || "-")}</strong></div>
            <div class="profile-detail-row"><span>Email</span><strong>${esc(user?.email || "-")}</strong></div>
            <div class="profile-detail-row"><span>Date of Birth</span><strong>${esc(user?.dateOfBirth || "-")}</strong></div>
            <div class="profile-detail-row"><span>Emergency Contact</span><strong>${esc(user?.emergencyContact || "-")}</strong></div>
            <div class="profile-detail-row"><span>Address</span><strong>${esc(user?.address || "-")}</strong></div>
          </div>
        </section>`;
      $("page").insertAdjacentHTML("beforeend", `<section class="profile-footer-actions"><button id="documentsBtn" type="button">${footerIcon("docs")} Documents & KYC</button><button id="supportBtn" type="button">${footerIcon("help")} Help & Support</button><button id="logoutBtn" type="button">${footerIcon("logout")} Log out</button></section>`);
      $("editProfileBtn")?.addEventListener("click", openProfileEditSheet);
      $("personalEditBtn")?.addEventListener("click", openProfileEditSheet);
      $("updateLocationBtn")?.addEventListener("click", openLocationSheet);
      $("updateLocationInlineBtn")?.addEventListener("click", openLocationSheet);
      $("requestPayoutBtn")?.addEventListener("click", () => openPayoutSheet(displayAvailable));
      $("reportIssueBtn")?.addEventListener("click", () => openPrinterIssueSheet(printers[0]?.serialNumber || ""));
      document.querySelectorAll("[data-printer-issue]").forEach(btn => btn.addEventListener("click", () => openPrinterIssueSheet(btn.dataset.printerIssue)));
      $("documentsBtn")?.addEventListener("click", openDocumentsSheet);
      $("supportBtn")?.addEventListener("click", openSupportSheet);
      document.querySelectorAll("[data-profile-jump]").forEach(btn => btn.addEventListener("click", () => {
        document.querySelectorAll(".account-tabs button").forEach(tab => tab.classList.toggle("active", tab === btn));
        document.getElementById(btn.dataset.profileJump)?.scrollIntoView({ behavior: "smooth", block: "start" });
      }));
      $("manageBankBtn")?.addEventListener("click", () => {
        $("sheetCard").innerHTML = `
          <div class="section-head"><h2>Bank Change Request</h2><button class="icon-btn" id="closeSheetBtn" type="button"><svg viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>
          <div class="form">
            <label class="field">Bank Name <input id="bankDisplayName" value="${esc(bank.bankName || "")}"></label>
            <label class="field">Account Holder <input id="bankName" value="${esc(bank.name || user?.name || "")}"></label>
            <label class="field">Account Number <input id="bankAccount" inputmode="numeric" value="${esc(bank.accountNumber || "")}"></label>
            <label class="field">Confirm Account Number <input id="bankAccountConfirm" inputmode="numeric" value="${esc(bank.accountNumber || "")}"></label>
            <label class="field">IFSC <input id="bankIfsc" value="${esc(bank.ifsc || "")}"></label>
            <label class="field">UPI ID <input id="bankUpi" value="${esc(bank.upi || "")}"></label>
            <button class="btn" id="saveBankBtn" type="button">Submit For Verification</button>
          </div>`;
        $("sheet").classList.remove("hidden");
        $("closeSheetBtn").addEventListener("click", closeSheet);
        $("saveBankBtn")?.addEventListener("click", async () => {
          if (formValue("bankAccount") !== formValue("bankAccountConfirm")) {
            toast("Account numbers do not match.", "error");
            return;
          }
        const bankPayload = { bankName: formValue("bankDisplayName"), name: formValue("bankName"), accountNumber: formValue("bankAccount"), ifsc: formValue("bankIfsc"), upi: formValue("bankUpi") };
        localStorage.setItem("axzen_employee_bank", JSON.stringify(bankPayload));
        try {
          const body = await api("/marketing-api/me/bank", {
            method: "PUT",
            body: JSON.stringify({
              bankAccountName: bankPayload.name,
              bankAccountNumber: bankPayload.accountNumber,
              bankIfsc: bankPayload.ifsc,
              bankUpi: bankPayload.upi
            })
          });
          if (body.user) {
            user = body.user;
            localStorage.setItem(USER_KEY, JSON.stringify(user));
          }
          toast("Bank details uploaded.");
        } catch {
          toast("Bank details saved on this device.");
        }
          closeSheet();
          renderProfile();
        });
      });
      $("logoutBtn").addEventListener("click", logout);
    }

    function closeSheet() {
      $("sheet").classList.add("hidden");
    }

    function render() {
      if (route === "dashboard") return renderDashboard();
      if (route === "canteens") return renderCanteens();
      if (route === "canteenDetail") return renderDetail();
      if (route === "add") return renderAdd();
      if (route === "approvals") return renderApprovals();
      if (route === "payments") return renderPayments();
      if (route === "plans") return renderPlans();
      if (route === "team") return renderTeam();
      if (route === "reports") return renderReports();
      if (route === "profile") return renderProfile();
      return renderDashboard();
    }

    function openNotifications() {
      const rows = [
        ["Follow-up Reminder", "Call customers scheduled for today."],
        ["Overdue Follow-ups", "Review leads whose follow-up time has passed."],
        ["New Lead Assignments", "Newly assigned leads appear in My Customers."],
        ["Manager Messages", "Approval and pricing messages from manager."],
        ["Approval Updates", "Sale approvals and rejected requests."],
        ["Sale Notifications", "Closed sales waiting for manager approval."]
      ];
      openSheet("Notifications", `<div class="list">${rows.map(row => `<div class="row"><div><h3>${esc(row[0])}</h3><p>${esc(row[1])}</p></div>${pill("Open")}</div>`).join("")}</div>`);
    }

    async function login(event) {
      event.preventDefault();
      $("loginStatus").className = "status";
      $("loginStatus").textContent = "Checking login...";
      try {
        setBusy(true);
        const body = await api("/marketing-api/login", {
          method: "POST",
          body: JSON.stringify({ employeeId: $("loginId").value.trim(), password: $("password").value })
        });
        token = body.token;
        user = body.user;
        localStorage.setItem(TOKEN_KEY, token);
        localStorage.setItem(USER_KEY, JSON.stringify(user));
        route = "dashboard";
        stack = [];
        $("loginScreen").classList.add("hidden");
        $("appScreen").classList.remove("hidden");
        render();
        refreshData({ silent: true }).then(render).catch(() => {});
      } catch (error) {
        $("loginStatus").className = "status error";
        $("loginStatus").textContent = error.message;
      } finally {
        setBusy(false);
      }
    }

    function logout() {
      token = "";
      user = null;
      localStorage.removeItem(TOKEN_KEY);
      localStorage.removeItem(USER_KEY);
      $("appScreen").classList.add("hidden");
      $("loginScreen").classList.remove("hidden");
      stack = [];
    }

    $("loginForm").addEventListener("submit", login);
    $("backBtn").addEventListener("click", () => {
      route = stack.pop() || (route === "canteenDetail" ? "canteens" : "dashboard");
      render();
    });
    $("notifyBtn").addEventListener("click", openNotifications);
    $("sheet").addEventListener("click", event => {
      if (event.target.id === "sheet") closeSheet();
    });

    if (token && user) {
      $("loginScreen").classList.add("hidden");
      $("appScreen").classList.remove("hidden");
      render();
      refreshData({ silent: true }).then(render).catch(() => {});
    }
  </script>
</body>
</html>
