<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Axzen Employee</title>
  <style>
    :root {
      --page: #f4f6f8;
      --surface: #ffffff;
      --surface-2: #eef4ff;
      --ink: #17202a;
      --muted: #667085;
      --line: #dde3ea;
      --brand: #0a66c2;
      --brand-2: #09509a;
      --green: #12805c;
      --green-soft: #e7f7ef;
      --amber: #b45309;
      --amber-soft: #fff4df;
      --red: #b42318;
      --red-soft: #fee8e5;
      --violet: #6d3bc2;
      --violet-soft: #f0eafd;
      --cyan: #087f8c;
      --cyan-soft: #e4f7fa;
      --shadow: 0 16px 40px rgba(15, 23, 42, .08);
      --radius: 8px;
    }

    * { box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background: #dfe7ef;
      color: var(--ink);
      font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 14px;
      line-height: 1.45;
      letter-spacing: 0;
    }

    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
    h1, h2, h3, p { margin: 0; }
    svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .hidden { display: none !important; }

    .screen {
      width: min(100%, 480px);
      min-height: 100dvh;
      margin: 0 auto;
      background: var(--page);
      position: relative;
      overflow-x: hidden;
    }

    .login {
      display: grid;
      align-content: center;
      gap: 18px;
      padding: 22px;
      background:
        linear-gradient(180deg, rgba(10, 102, 194, .08), rgba(18, 128, 92, .08)),
        var(--page);
    }

    .brand {
      display: grid;
      gap: 10px;
    }
    .brand-mark {
      width: 52px;
      height: 52px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: #fff;
      background: var(--brand);
      font-size: 20px;
      font-weight: 900;
      box-shadow: 0 14px 28px rgba(10, 102, 194, .24);
    }
    .brand h1 {
      font-size: 30px;
      line-height: 36px;
      font-weight: 900;
    }
    .brand p {
      color: var(--muted);
      font-size: 14px;
      font-weight: 650;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
      padding: 16px;
      display: grid;
      gap: 14px;
    }

    .subtle-panel {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fbfcfe;
      padding: 13px;
      display: grid;
      gap: 10px;
    }

    .field {
      display: grid;
      gap: 6px;
      color: #344054;
      font-size: 12px;
      font-weight: 800;
    }
    input, select, textarea {
      width: 100%;
      min-height: 44px;
      border: 1px solid #cbd5e1;
      border-radius: var(--radius);
      padding: 10px 11px;
      background: #fff;
      color: var(--ink);
      outline: none;
    }
    textarea { min-height: 84px; resize: vertical; }
    input:focus, select:focus, textarea:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(10, 102, 194, .14);
    }

    .role-toggle, .chips, .actions {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .role-toggle::-webkit-scrollbar, .chips::-webkit-scrollbar, .actions::-webkit-scrollbar { display: none; }

    .chip {
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0 14px;
      background: #fff;
      color: #475467;
      font-size: 12px;
      font-weight: 850;
      white-space: nowrap;
    }
    .chip.active {
      background: var(--brand);
      border-color: var(--brand);
      color: #fff;
    }

    .btn {
      min-height: 44px;
      border: 0;
      border-radius: var(--radius);
      padding: 0 13px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--brand);
      color: #fff;
      text-decoration: none;
      font-weight: 850;
      white-space: nowrap;
    }
    .btn.small { min-height: 34px; padding: 0 10px; font-size: 12px; }
    .btn.soft { background: var(--surface-2); color: var(--brand); border: 1px solid #c9dcfb; }
    .btn.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); }
    .btn.green { background: var(--green); }
    .btn.amber { background: #d97706; }
    .btn.red { background: var(--red); }
    .btn:disabled { opacity: .58; cursor: not-allowed; }

    .status {
      min-height: 20px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }
    .status.error { color: var(--red); }
    .status.ok { color: var(--green); }

    .app {
      min-height: 100dvh;
      padding-bottom: calc(84px + env(safe-area-inset-bottom));
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 12;
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: calc(12px + env(safe-area-inset-top)) 14px 12px;
      border-bottom: 1px solid rgba(221, 227, 234, .9);
      background: rgba(255, 255, 255, .96);
      backdrop-filter: blur(14px);
    }

    .title-area {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .title-mark {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: var(--brand);
      color: #fff;
      font-weight: 950;
    }
    .title-text { min-width: 0; }
    .title-text h1 {
      font-size: 19px;
      line-height: 24px;
      font-weight: 900;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .title-text p {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .icon-btn {
      width: 42px;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      display: grid;
      place-items: center;
      background: #fff;
      color: var(--brand);
    }

    main {
      display: grid;
      gap: 14px;
      padding: 14px;
    }

    .hero {
      display: grid;
      gap: 14px;
      border-radius: var(--radius);
      padding: 18px;
      background: linear-gradient(135deg, #0a66c2, #12805c);
      color: #fff;
      box-shadow: 0 18px 36px rgba(10, 102, 194, .22);
    }
    .hero h2 {
      font-size: 19px;
      line-height: 25px;
      font-weight: 900;
    }
    .hero p { color: rgba(255,255,255,.84); font-weight: 700; }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .section-head h2 {
      font-size: 16px;
      line-height: 22px;
      font-weight: 900;
    }
    .muted { color: var(--muted); font-size: 12px; font-weight: 700; }

    .metrics {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .metrics.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .metric {
      min-height: 78px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      padding: 12px;
    }
    .metric strong {
      display: block;
      color: var(--brand);
      font-size: 20px;
      line-height: 25px;
      font-weight: 950;
      overflow-wrap: anywhere;
    }
    .metric span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
      line-height: 15px;
      font-weight: 800;
    }

    .list { display: grid; gap: 10px; }
    .row {
      min-width: 0;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      padding: 13px;
    }
    .row.stack { grid-template-columns: 1fr; }
    .row.clickable { cursor: pointer; }
    .row h3 {
      font-size: 14px;
      line-height: 20px;
      font-weight: 900;
      overflow-wrap: anywhere;
    }
    .row p {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      line-height: 17px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .pill {
      min-height: 25px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 9px;
      background: var(--surface-2);
      color: var(--brand);
      font-size: 11px;
      line-height: 13px;
      font-weight: 900;
      white-space: nowrap;
    }
    .pill.green { background: var(--green-soft); color: var(--green); }
    .pill.amber { background: var(--amber-soft); color: var(--amber); }
    .pill.red { background: var(--red-soft); color: var(--red); }
    .pill.violet { background: var(--violet-soft); color: var(--violet); }
    .pill.cyan { background: var(--cyan-soft); color: var(--cyan); }

    .form {
      display: grid;
      gap: 11px;
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .full { grid-column: 1 / -1; }

    .kv-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }
    .kv {
      min-height: 60px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fbfcfe;
      padding: 10px;
    }
    .kv span { display: block; color: var(--muted); font-size: 11px; font-weight: 800; }
    .kv strong { display: block; margin-top: 5px; font-weight: 900; overflow-wrap: anywhere; }

    .bottom-nav {
      position: fixed;
      left: 50%;
      bottom: 0;
      z-index: 18;
      transform: translateX(-50%);
      width: min(100%, 480px);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
      padding: 8px 9px calc(8px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--line);
      background: rgba(255,255,255,.98);
      backdrop-filter: blur(14px);
    }
    .nav-btn {
      min-height: 58px;
      border: 0;
      border-radius: var(--radius);
      display: grid;
      place-items: center;
      gap: 2px;
      background: transparent;
      color: #475467;
      font-size: 10px;
      line-height: 12px;
      font-weight: 850;
    }
    .nav-btn.active {
      background: var(--surface-2);
      color: var(--brand);
    }

    .sheet {
      position: fixed;
      inset: 0;
      z-index: 35;
      display: grid;
      align-items: end;
      background: rgba(15, 23, 42, .38);
      padding: 12px;
    }
    .sheet-card {
      width: min(100%, 456px);
      max-height: calc(100dvh - 40px);
      overflow-y: auto;
      margin: 0 auto;
      border-radius: var(--radius);
      background: #fff;
      box-shadow: 0 22px 54px rgba(15, 23, 42, .28);
      padding: 16px;
      display: grid;
      gap: 12px;
    }

    .empty {
      min-height: 130px;
      border: 1px dashed #cbd5e1;
      border-radius: var(--radius);
      display: grid;
      place-items: center;
      text-align: center;
      padding: 18px;
      color: var(--muted);
      font-weight: 750;
    }

    @media (max-width: 380px) {
      main { padding: 12px 10px; }
      .metrics.three { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .form-grid, .kv-grid { grid-template-columns: 1fr; }
      .btn { white-space: normal; text-align: center; }
    }
  </style>
</head>
<body>
  <section class="screen login" id="loginScreen">
    <div class="brand">
      <div class="brand-mark">AX</div>
      <h1>Axzen Employee</h1>
      <p>Customer onboarding, approvals, payments, printers and team tracking in one clean workflow.</p>
    </div>
    <form class="panel" id="loginForm">
      <div class="role-toggle">
        <button class="chip active" type="button" data-login-role="employee">Employee</button>
        <button class="chip" type="button" data-login-role="manager">Manager</button>
      </div>
      <label class="field">Employee ID <input id="loginId" value="MKT001" autocomplete="username" required></label>
      <label class="field">Password <input id="password" value="1234" type="password" autocomplete="current-password" required></label>
      <button class="btn" id="loginBtn" type="submit">Login</button>
      <div class="status" id="loginStatus">Employee: MKT001 / 1234. Manager: SUPER / admin123.</div>
    </form>
  </section>

  <section class="screen app hidden" id="appScreen">
    <header class="topbar">
      <div class="title-area">
        <button class="icon-btn hidden" id="backBtn" type="button" aria-label="Back">
          <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <div class="title-mark" id="titleMark">AX</div>
        <div class="title-text">
          <h1 id="pageTitle">Dashboard</h1>
          <p id="pageSub">Axzen employee workflow</p>
        </div>
      </div>
      <button class="icon-btn" id="refreshBtn" type="button" aria-label="Refresh">
        <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 1-9 9 9.5 9.5 0 0 1-6.7-2.7"/><path d="M3 12a9 9 0 0 1 9-9 9.5 9.5 0 0 1 6.7 2.7"/><path d="M3 5v7h7"/><path d="M21 19v-7h-7"/></svg>
      </button>
    </header>
    <main id="page"></main>
    <nav class="bottom-nav" id="tabs"></nav>
  </section>

  <div class="sheet hidden" id="sheet">
    <div class="sheet-card" id="sheetCard"></div>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const liveApi = "https://canteen.axzen.in";
    const API = (window.Capacitor || location.protocol === "capacitor:") ? liveApi : "";
    const TOKEN_KEY = "axzen_employee_token";
    const USER_KEY = "axzen_employee_user";

    const icons = {
      home: '<svg viewBox="0 0 24 24"><path d="m3 11 9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/></svg>',
      leads: '<svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6"/><path d="M22 11h-6"/></svg>',
      plus: '<svg viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M5 12h14"/></svg>',
      rupee: '<svg viewBox="0 0 24 24"><path d="M6 3h12"/><path d="M6 8h12"/><path d="M6 13h5a5 5 0 0 0 0-10"/><path d="m6 13 8 8"/></svg>',
      users: '<svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
      chart: '<svg viewBox="0 0 24 24"><path d="M4 19V5"/><path d="M4 19h16"/><rect x="7" y="11" width="3" height="5"/><rect x="12" y="7" width="3" height="9"/><rect x="17" y="4" width="3" height="12"/></svg>',
      user: '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 0 0-16 0"/></svg>'
    };

    const esc = value => String(value ?? "").replace(/[&<>"']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]));
    const money = value => "Rs " + Number(value || 0).toLocaleString("en-IN");
    const fmtDate = value => value ? new Date(value).toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" }) : "-";
    const mobileDigits = value => String(value || "").replace(/\D/g, "");
    const today = () => new Date().toISOString().slice(0, 10);

    let selectedLoginRole = "employee";
    let token = localStorage.getItem(TOKEN_KEY) || "";
    let user = readJson(USER_KEY);
    let route = "dashboard";
    let stack = [];
    let data = demoData();
    let selectedCanteenId = null;
    let busy = false;
    let filterStatus = "All";

    function readJson(key) {
      try { return JSON.parse(localStorage.getItem(key) || "null"); }
      catch { return null; }
    }

    function demoData() {
      const now = new Date().toISOString();
      return {
        canteens: [
          { id: 1001, canteenName: "Sri Lakshmi Foods", businessCategory: "Canteen", ownerName: "Ramesh Kumar", ownerMobile: "9876543210", city: "Hyderabad", state: "Telangana", counters: 2, printersRequired: 2, printersAssigned: 0, selectedPlan: "Professional", planType: "Paid", paidAmount: 12000, pendingAmount: 3000, paymentMode: "UPI", status: "Pending Approval", submittedBy: "MKT001", submittedByName: "Venkatesh", notes: "Needs printer and menu setup.", createdAt: now },
          { id: 1002, canteenName: "Metro Staff Canteen", businessCategory: "Restaurant", ownerName: "Saleem", ownerMobile: "9848012345", city: "Khammam", state: "Telangana", counters: 1, printersRequired: 1, printersAssigned: 1, selectedPlan: "Starter", planType: "Trial", paidAmount: 0, pendingAmount: 0, paymentMode: "Trial", status: "Trial", submittedBy: "MKT002", submittedByName: "Sravani", activatedCanteenId: "AXC-1002", canteenLoginId: "AXC1002", defaultPassword: "AXZEN1002", createdAt: now }
        ],
        users: [
          { employeeId: "MKT001", name: "Venkatesh", role: "marketing", active: true, target: 20 },
          { employeeId: "MKT002", name: "Sravani", role: "marketing", active: true, target: 18 }
        ],
        payments: [{ id: 1, canteenId: 1001, canteenName: "Sri Lakshmi Foods", amount: 12000, pendingAmount: 3000, paymentMode: "UPI", collectedByName: "Venkatesh", createdAt: now }],
        printers: [{ serialNumber: "AXP1001", model: "58mm Bluetooth", status: "Stock" }],
        enquiries: [],
        activities: [],
        summary: {
          cards: {
            totalCanteens: 2, activeCanteens: 0, trialCanteens: 1, expiredCanteens: 0, blockedCanteens: 0,
            todaysRegistrations: 1, todaysCollections: 12000, monthlyRevenue: 12000, pendingPayments: 3000,
            printersAssigned: 1, printersAvailable: 1, pendingInstallations: 1, totalEnquiries: 0, newEnquiries: 0
          },
          marketingPerformance: [
            { employeeId: "MKT001", name: "Venkatesh", registrations: 1, approved: 0, rejected: 0, collection: 12000, pending: 3000, target: 20 },
            { employeeId: "MKT002", name: "Sravani", registrations: 1, approved: 1, rejected: 0, collection: 0, pending: 0, target: 18 }
          ],
          recentActivities: []
        }
      };
    }

    async function api(path, options = {}) {
      const headers = { "Content-Type": "application/json", ...(options.headers || {}) };
      if (token) headers.Authorization = `Bearer ${token}`;
      const response = await fetch(`${API}${path}`, { ...options, headers });
      const body = await response.json().catch(() => ({}));
      if (!response.ok || body.success === false) throw new Error(body.message || "Server request failed");
      return body;
    }

    function isManager() {
      return user?.role === "super_admin" || user?.role === "manager";
    }

    function metric(label, value) {
      return `<div class="metric"><strong>${esc(value)}</strong><span>${esc(label)}</span></div>`;
    }

    function kv(label, value) {
      return `<div class="kv"><span>${esc(label)}</span><strong>${esc(value || "-")}</strong></div>`;
    }

    function pill(status) {
      const text = String(status || "New");
      const lower = text.toLowerCase();
      const tone = lower.includes("active") || lower.includes("paid") || lower.includes("approved") || lower.includes("trial") ? "green"
        : lower.includes("pending") || lower.includes("progress") ? "amber"
        : lower.includes("reject") || lower.includes("block") || lower.includes("expired") ? "red"
        : lower.includes("stock") || lower.includes("executive") ? "cyan"
        : "violet";
      return `<span class="pill ${tone}">${esc(text)}</span>`;
    }

    function setPage(title, sub) {
      $("pageTitle").textContent = title;
      $("pageSub").textContent = sub || (isManager() ? "Manager control center" : "Employee sales workflow");
      $("titleMark").textContent = isManager() ? "SA" : "AX";
      $("backBtn").classList.toggle("hidden", stack.length === 0);
      renderTabs();
    }

    function navItems() {
      return isManager()
        ? [["dashboard", icons.home, "Home"], ["canteens", icons.leads, "Leads"], ["approvals", icons.plus, "Approve"], ["team", icons.users, "Team"], ["profile", icons.user, "Profile"]]
        : [["dashboard", icons.home, "Home"], ["canteens", icons.leads, "Leads"], ["add", icons.plus, "Add"], ["payments", icons.rupee, "Money"], ["profile", icons.user, "Profile"]];
    }

    function renderTabs() {
      $("tabs").innerHTML = navItems().map(([id, icon, label]) =>
        `<button class="nav-btn ${route === id ? "active" : ""}" type="button" data-nav="${id}">${icon}<span>${label}</span></button>`
      ).join("");
      document.querySelectorAll("[data-nav]").forEach(btn => btn.addEventListener("click", () => go(btn.dataset.nav)));
    }

    function go(next, push = true) {
      if (push && route !== next) stack.push(route);
      route = next;
      render();
      window.scrollTo({ top: 0, behavior: "instant" });
    }

    function bindRoutes(root = document) {
      root.querySelectorAll("[data-route]").forEach(el => el.addEventListener("click", () => {
        closeSheet();
        go(el.dataset.route);
      }));
      root.querySelectorAll("[data-canteen]").forEach(el => el.addEventListener("click", () => {
        selectedCanteenId = Number(el.dataset.canteen);
        go("canteenDetail");
      }));
    }

    async function refreshData({ silent = false } = {}) {
      if (!token) return;
      try {
        if (!silent) setBusy(true);
        const body = await api("/marketing-api/dashboard");
        data = { ...demoData(), ...body };
      } catch (error) {
        toast(error.message + ". Showing cached demo data.", "error");
      } finally {
        setBusy(false);
      }
    }

    function setBusy(next) {
      busy = next;
      document.querySelectorAll("button").forEach(btn => {
        if (btn.id !== "backBtn") btn.disabled = next;
      });
    }

    function toast(message, type = "ok") {
      const card = $("sheetCard");
      card.innerHTML = `<div class="section-head"><h2>${type === "error" ? "Problem" : "Done"}</h2><button class="icon-btn" id="closeToast" type="button"><svg viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div><p class="status ${type === "error" ? "error" : "ok"}">${esc(message)}</p>`;
      $("sheet").classList.remove("hidden");
      $("closeToast").addEventListener("click", closeSheet);
    }

    function currentRows() {
      let rows = Array.isArray(data.canteens) ? data.canteens : [];
      if (!isManager() && user?.employeeId) rows = rows.filter(row => String(row.submittedBy || "") === String(user.employeeId));
      if (filterStatus !== "All") rows = rows.filter(row => String(row.status || "").toLowerCase().includes(filterStatus.toLowerCase()));
      return rows;
    }

    function selectedCanteen() {
      return (data.canteens || []).find(row => Number(row.id) === Number(selectedCanteenId)) || currentRows()[0] || data.canteens?.[0];
    }

    function renderDashboard() {
      const cards = data.summary?.cards || {};
      const rows = currentRows();
      setPage(isManager() ? "Control Center" : `Hi, ${user?.name || "Employee"}`, isManager() ? "Approvals, collections and team" : "Add customers and complete onboarding");
      $("page").innerHTML = `
        <section class="hero">
          <div class="section-head">
            <div><h2>${isManager() ? "Business Snapshot" : "Today's Sales Route"}</h2><p>${fmtDate(new Date())}</p></div>
            ${pill(token ? "Live" : "Demo")}
          </div>
          <div class="metrics three">
            ${metric("Customers", cards.totalCanteens ?? rows.length)}
            ${metric("Pending", rows.filter(x => String(x.status).includes("Pending")).length)}
            ${metric("Collection", money(cards.todaysCollections || cards.monthlyRevenue || 0))}
          </div>
        </section>
        <section class="metrics three">
          ${metric("Active", cards.activeCanteens || 0)}
          ${metric("Trial", cards.trialCanteens || 0)}
          ${metric("Pending Pay", money(cards.pendingPayments || 0))}
          ${metric("Printers", cards.printersAssigned || 0)}
          ${metric("Installations", cards.pendingInstallations || 0)}
          ${metric("Today New", cards.todaysRegistrations || 0)}
        </section>
        <section class="panel">
          <div class="section-head"><h2>${isManager() ? "Needs Action" : "My Recent Customers"}</h2><button class="btn small soft" type="button" data-route="${isManager() ? "approvals" : "add"}">${isManager() ? "Open" : "Add New"}</button></div>
          <div class="list">${customerList(rows.slice(0, 5))}</div>
        </section>
        <section class="panel">
          <div class="section-head"><h2>Fast Actions</h2>${pill(user?.employeeId || "User")}</div>
          <div class="actions">
            <button class="btn small" type="button" data-route="${isManager() ? "approvals" : "add"}">${isManager() ? "Review Approvals" : "Add Customer"}</button>
            <button class="btn small soft" type="button" data-route="payments">Payments</button>
            <button class="btn small soft" type="button" data-route="${isManager() ? "team" : "reports"}">Reports</button>
          </div>
        </section>`;
      bindRoutes();
    }

    function customerList(rows) {
      if (!rows.length) return `<div class="empty">No customers found.</div>`;
      return rows.map(row => `
        <article class="row clickable" data-canteen="${esc(row.id)}">
          <div>
            <h3>${esc(row.canteenName)}</h3>
            <p>${esc(row.ownerName)} | ${esc(row.ownerMobile)}</p>
            <p>${esc([row.city, row.state].filter(Boolean).join(", "))} | ${esc(row.selectedPlan || "Plan not set")}</p>
          </div>
          <div>${pill(row.status)}</div>
        </article>`).join("");
    }

    function renderCanteens() {
      setPage(isManager() ? "All Customers" : "My Customers", `${currentRows().length} records`);
      const tabs = ["All", "Pending", "Active", "Trial", "Rejected", "Blocked"];
      $("page").innerHTML = `
        <section class="chips">${tabs.map(tab => `<button class="chip ${filterStatus === tab ? "active" : ""}" type="button" data-filter="${tab}">${tab}</button>`).join("")}</section>
        <section class="list">${customerList(currentRows())}</section>`;
      document.querySelectorAll("[data-filter]").forEach(btn => btn.addEventListener("click", () => {
        filterStatus = btn.dataset.filter;
        renderCanteens();
      }));
      bindRoutes();
    }

    function renderDetail() {
      const item = selectedCanteen();
      if (!item) {
        setPage("Customer", "No record");
        $("page").innerHTML = `<div class="empty">No customer selected.</div>`;
        return;
      }
      setPage(item.canteenName, item.ownerName);
      const phone = mobileDigits(item.ownerMobile);
      const waText = encodeURIComponent(`Hi ${item.ownerName || ""}, Axzen POS onboarding update for ${item.canteenName}.`);
      $("page").innerHTML = `
        <section class="panel">
          <div class="section-head"><div><h2>${esc(item.canteenName)}</h2><p class="muted">${esc(item.businessCategory || "Business")} | ${esc(item.city || "-")}</p></div>${pill(item.status)}</div>
          <div class="kv-grid">
            ${kv("Owner", item.ownerName)}
            ${kv("Phone", item.ownerMobile)}
            ${kv("Plan", item.selectedPlan)}
            ${kv("Payment", `${money(item.paidAmount)} paid`)}
            ${kv("Pending", money(item.pendingAmount))}
            ${kv("Printers", `${item.printersAssigned || 0}/${item.printersRequired || 0}`)}
          </div>
          <div class="actions">
            <a class="btn small green" href="tel:${esc(phone)}">Call</a>
            <a class="btn small green" href="https://wa.me/91${esc(phone)}?text=${waText}" target="_blank" rel="noopener">WhatsApp</a>
            ${isManager() ? `<button class="btn small soft" type="button" data-action="payment">Update Payment</button>` : ""}
          </div>
        </section>
        <section class="panel">
          <h2>Onboarding Workflow</h2>
          <div class="list">
            ${workflowRow("Lead submitted", true)}
            ${workflowRow("Manager approval", ["Active", "Trial"].includes(item.status) || item.activatedCanteenId)}
            ${workflowRow("Payment collected", Number(item.paidAmount || 0) > 0)}
            ${workflowRow("Printer assigned", Number(item.printersAssigned || 0) >= Number(item.printersRequired || 0))}
            ${workflowRow("Customer login ready", item.canteenLoginId)}
          </div>
        </section>
        <section class="panel">
          <div class="section-head"><h2>Credentials</h2>${item.canteenLoginId ? pill("Ready") : pill("After Approval")}</div>
          <div class="kv-grid">
            ${kv("Canteen ID", item.activatedCanteenId)}
            ${kv("Login ID", item.canteenLoginId)}
            ${kv("Password", item.defaultPassword)}
            ${kv("Expiry", item.planExpiryDate)}
          </div>
        </section>`;
      document.querySelector("[data-action='payment']")?.addEventListener("click", () => openPaymentSheet(item));
    }

    function workflowRow(label, done) {
      return `<div class="row"><div><h3>${esc(label)}</h3><p>${done ? "Completed" : "Waiting"}</p></div>${pill(done ? "Done" : "Pending")}</div>`;
    }

    function renderAdd() {
      if (isManager()) {
        setPage("Add Customer", "Employee role submits customers");
        $("page").innerHTML = `
          <section class="panel">
            <h2>Employee workflow required</h2>
            <p class="muted">New customer registrations must be submitted from a marketing employee login. Manager login is for approval, payment, plan, printer and team control.</p>
            <div class="actions">
              <button class="btn small" type="button" data-route="approvals">Review Approvals</button>
              <button class="btn small soft" type="button" data-route="team">Manage Team</button>
            </div>
          </section>`;
        bindRoutes();
        return;
      } else {
        setPage("Add Customer", "Submit for manager approval");
      }
      $("page").innerHTML = `
        <section class="panel">
          <form class="form" id="customerForm">
            <div class="form-grid">
              <label class="field full">Business Name <input id="canteenName" placeholder="Sri Sai Restaurant" required></label>
              <label class="field">Owner Name <input id="ownerName" placeholder="Owner name" required></label>
              <label class="field">Owner Mobile <input id="ownerMobile" inputmode="tel" placeholder="9876543210" required></label>
              <label class="field">Business Type <select id="businessCategory"><option>Canteen</option><option>Restaurant</option><option>Hotel</option><option>Cafe</option><option>Bakery</option><option>Chicken Shop</option><option>Retail</option></select></label>
              <label class="field">City <input id="city" placeholder="Hyderabad"></label>
              <label class="field">State <input id="state" value="Telangana"></label>
              <label class="field">Counters <input id="counters" type="number" min="1" value="1"></label>
              <label class="field">Printers Required <input id="printersRequired" type="number" min="0" value="1"></label>
              <label class="field">Plan <select id="selectedPlan"><option>Starter</option><option>Professional</option><option>Premium</option><option>Enterprise</option></select></label>
              <label class="field">Plan Type <select id="planType"><option>Trial</option><option>Paid</option></select></label>
              <label class="field">Paid Amount <input id="paidAmount" type="number" min="0" value="0"></label>
              <label class="field">Pending Amount <input id="pendingAmount" type="number" min="0" value="0"></label>
              <label class="field">Payment Mode <select id="paymentMode"><option>UPI</option><option>Cash</option><option>Bank Transfer</option><option>Payment Link</option><option>Trial</option></select></label>
              <label class="field">Start Date <input id="planStartDate" type="date" value="${today()}"></label>
              <label class="field full">Address <textarea id="address" placeholder="Full shop address"></textarea></label>
              <label class="field full">Notes <textarea id="notes" placeholder="Menu setup, printer, follow-up notes"></textarea></label>
            </div>
            <button class="btn" type="submit">${isManager() ? "Submit Anyway" : "Submit For Approval"}</button>
          </form>
        </section>`;
      $("customerForm").addEventListener("submit", submitCustomer);
    }

    async function submitCustomer(event) {
      event.preventDefault();
      const payload = {
        canteenName: $("canteenName").value.trim(),
        ownerName: $("ownerName").value.trim(),
        ownerMobile: $("ownerMobile").value.trim(),
        businessCategory: $("businessCategory").value,
        city: $("city").value.trim(),
        state: $("state").value.trim(),
        counters: Number($("counters").value || 1),
        printersRequired: Number($("printersRequired").value || 0),
        selectedPlan: $("selectedPlan").value,
        planType: $("planType").value,
        paidAmount: Number($("paidAmount").value || 0),
        pendingAmount: Number($("pendingAmount").value || 0),
        paymentMode: $("paymentMode").value,
        planStartDate: $("planStartDate").value,
        address: $("address").value.trim(),
        notes: $("notes").value.trim()
      };
      try {
        setBusy(true);
        const body = await api("/marketing-api/canteens", { method: "POST", body: JSON.stringify(payload) });
        selectedCanteenId = body.canteen.id;
        await refreshData({ silent: true });
        toast("Customer submitted for manager approval.");
        go("canteenDetail");
      } catch (error) {
        toast(error.message, "error");
      } finally {
        setBusy(false);
      }
    }

    function renderApprovals() {
      const pending = (data.canteens || []).filter(row => String(row.status || "").toLowerCase().includes("pending"));
      setPage("Approvals", `${pending.length} pending customers`);
      $("page").innerHTML = `<section class="list">${pending.length ? pending.map(row => `
        <article class="panel">
          <div class="section-head"><div><h2>${esc(row.canteenName)}</h2><p class="muted">${esc(row.ownerName)} | ${esc(row.ownerMobile)}</p></div>${pill(row.status)}</div>
          <div class="kv-grid">${kv("Plan", row.selectedPlan)}${kv("Paid", money(row.paidAmount))}${kv("Pending", money(row.pendingAmount))}${kv("Printers", row.printersRequired)}</div>
          <div class="actions">
            <button class="btn small green" type="button" data-approve="${row.id}">Approve</button>
            <button class="btn small red" type="button" data-reject="${row.id}">Reject</button>
            <button class="btn small soft" type="button" data-canteen="${row.id}">Details</button>
          </div>
        </article>`).join("") : `<div class="empty">No pending approvals.</div>`}</section>`;
      document.querySelectorAll("[data-approve]").forEach(btn => btn.addEventListener("click", () => approveCanteen(btn.dataset.approve)));
      document.querySelectorAll("[data-reject]").forEach(btn => btn.addEventListener("click", () => openRejectSheet(btn.dataset.reject)));
      bindRoutes();
    }

    async function approveCanteen(id) {
      try {
        setBusy(true);
        await api(`/marketing-api/canteens/${id}/approve`, { method: "POST", body: JSON.stringify({ status: "Trial" }) });
        await refreshData({ silent: true });
        toast("Customer approved and login credentials generated.");
        renderApprovals();
      } catch (error) {
        toast(error.message, "error");
      } finally {
        setBusy(false);
      }
    }

    function openRejectSheet(id) {
      $("sheetCard").innerHTML = `
        <div class="section-head"><h2>Reject Customer</h2><button class="icon-btn" id="closeSheetBtn" type="button"><svg viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>
        <label class="field">Reason <textarea id="rejectReason">Documents or payment pending.</textarea></label>
        <button class="btn red" id="confirmReject" type="button">Reject</button>`;
      $("sheet").classList.remove("hidden");
      $("closeSheetBtn").addEventListener("click", closeSheet);
      $("confirmReject").addEventListener("click", async () => {
        try {
          setBusy(true);
          await api(`/marketing-api/canteens/${id}/reject`, { method: "POST", body: JSON.stringify({ reason: $("rejectReason").value.trim() }) });
          closeSheet();
          await refreshData({ silent: true });
          renderApprovals();
        } catch (error) {
          toast(error.message, "error");
        } finally {
          setBusy(false);
        }
      });
    }

    function renderPayments() {
      setPage("Payments", isManager() ? "Collections and dues" : "My collected payments");
      const rows = data.payments || [];
      $("page").innerHTML = `
        <section class="metrics three">
          ${metric("Collected", money(rows.reduce((sum, row) => sum + Number(row.amount || 0), 0)))}
          ${metric("Pending", money((data.summary?.cards?.pendingPayments) || 0))}
          ${metric("Records", rows.length)}
        </section>
        <section class="list">${rows.length ? rows.map(row => `
          <article class="row">
            <div><h3>${esc(row.canteenName)}</h3><p>${esc(row.collectedByName || row.collectedBy || "-")} | ${esc(row.paymentMode)} | ${fmtDate(row.createdAt)}</p></div>
            <div><strong>${money(row.amount)}</strong><p>${pill(Number(row.pendingAmount || 0) > 0 ? "Pending" : "Paid")}</p></div>
          </article>`).join("") : `<div class="empty">No payment records.</div>`}</section>`;
    }

    function openPaymentSheet(item) {
      $("sheetCard").innerHTML = `
        <div class="section-head"><h2>Update Payment</h2><button class="icon-btn" id="closeSheetBtn" type="button"><svg viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>
        <label class="field">Paid Amount <input id="payPaid" type="number" value="${Number(item.paidAmount || 0)}"></label>
        <label class="field">Pending Amount <input id="payPending" type="number" value="${Number(item.pendingAmount || 0)}"></label>
        <label class="field">Payment Mode <select id="payMode"><option>UPI</option><option>Cash</option><option>Bank Transfer</option><option>Payment Link</option></select></label>
        <button class="btn" id="savePayment" type="button">Save Payment</button>`;
      $("sheet").classList.remove("hidden");
      $("closeSheetBtn").addEventListener("click", closeSheet);
      $("savePayment").addEventListener("click", async () => {
        try {
          setBusy(true);
          await api(`/marketing-api/canteens/${item.id}/payment`, { method: "POST", body: JSON.stringify({ paidAmount: Number($("payPaid").value || 0), pendingAmount: Number($("payPending").value || 0), paymentMode: $("payMode").value }) });
          closeSheet();
          await refreshData({ silent: true });
          renderDetail();
        } catch (error) {
          toast(error.message, "error");
        } finally {
          setBusy(false);
        }
      });
    }

    function renderTeam() {
      setPage("Team", "Employees and targets");
      $("page").innerHTML = `
        <section class="panel">
          <div class="section-head"><h2>Sales Team</h2><button class="btn small" type="button" id="addEmployeeBtn">Add Employee</button></div>
          <div class="list">${(data.users || []).map(row => `
            <article class="row">
              <div><h3>${esc(row.name)}</h3><p>${esc(row.employeeId)} | Target ${esc(row.target || 0)} | ${esc(row.role)}</p></div>
              <button class="btn small ${row.active !== false ? "red" : "green"}" type="button" data-block="${esc(row.employeeId)}">${row.active !== false ? "Block" : "Activate"}</button>
            </article>`).join("")}</div>
        </section>
        <section class="panel">
          <h2>Performance</h2>
          <div class="list">${(data.summary?.marketingPerformance || []).map(row => `
            <article class="row">
              <div><h3>${esc(row.name)}</h3><p>${esc(row.registrations)} customers | ${esc(row.approved)} approved | Target ${esc(row.target)}</p></div>
              <strong>${money(row.collection)}</strong>
            </article>`).join("")}</div>
        </section>`;
      $("addEmployeeBtn").addEventListener("click", openEmployeeSheet);
      document.querySelectorAll("[data-block]").forEach(btn => btn.addEventListener("click", () => toggleEmployee(btn.dataset.block)));
    }

    function openEmployeeSheet() {
      $("sheetCard").innerHTML = `
        <div class="section-head"><h2>Add Employee</h2><button class="icon-btn" id="closeSheetBtn" type="button"><svg viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>
        <label class="field">Employee ID <input id="empId" value="MKT003"></label>
        <label class="field">Name <input id="empName" placeholder="Employee name"></label>
        <label class="field">Mobile <input id="empMobile" inputmode="tel"></label>
        <label class="field">Password <input id="empPass" value="1234"></label>
        <label class="field">Monthly Target <input id="empTarget" type="number" value="20"></label>
        <button class="btn" id="saveEmployee" type="button">Save Employee</button>`;
      $("sheet").classList.remove("hidden");
      $("closeSheetBtn").addEventListener("click", closeSheet);
      $("saveEmployee").addEventListener("click", async () => {
        try {
          setBusy(true);
          await api("/marketing-api/users", { method: "POST", body: JSON.stringify({ employeeId: $("empId").value.trim(), name: $("empName").value.trim(), mobile: $("empMobile").value.trim(), password: $("empPass").value, target: Number($("empTarget").value || 0), role: "marketing", active: true }) });
          closeSheet();
          await refreshData({ silent: true });
          renderTeam();
        } catch (error) {
          toast(error.message, "error");
        } finally {
          setBusy(false);
        }
      });
    }

    async function toggleEmployee(employeeId) {
      const row = (data.users || []).find(item => String(item.employeeId) === String(employeeId));
      try {
        setBusy(true);
        await api(`/marketing-api/users/${encodeURIComponent(employeeId)}/block`, { method: "POST", body: JSON.stringify({ blocked: row?.active !== false }) });
        await refreshData({ silent: true });
        renderTeam();
      } catch (error) {
        toast(error.message, "error");
      } finally {
        setBusy(false);
      }
    }

    function renderReports() {
      const rows = data.summary?.marketingPerformance || [];
      setPage("Reports", "Sales, approvals and collection");
      $("page").innerHTML = `
        <section class="metrics three">
          ${metric("Revenue", money(data.summary?.cards?.monthlyRevenue || 0))}
          ${metric("Pending", money(data.summary?.cards?.pendingPayments || 0))}
          ${metric("Customers", data.summary?.cards?.totalCanteens || 0)}
        </section>
        <section class="panel">
          <h2>Employee Report</h2>
          <div class="list">${rows.length ? rows.map(row => `
            <article class="row">
              <div><h3>${esc(row.name)}</h3><p>${esc(row.employeeId)} | ${row.registrations} registrations | ${row.rejected} rejected</p></div>
              <strong>${money(row.collection)}</strong>
            </article>`).join("") : `<div class="empty">Report data not available.</div>`}</div>
        </section>`;
    }

    function renderProfile() {
      setPage("Profile", user?.role || "employee");
      $("page").innerHTML = `
        <section class="panel">
          <div class="section-head"><div><h2>${esc(user?.name || "User")}</h2><p class="muted">${esc(user?.employeeId || "")} | ${esc(user?.role || "")}</p></div>${pill(user?.active !== false ? "Active" : "Blocked")}</div>
          <div class="kv-grid">${kv("Mobile", user?.mobile)}${kv("Target", user?.target)}${kv("Mode", token ? "Live API" : "Demo fallback")}${kv("API", API || "Same domain")}</div>
          <button class="btn red" id="logoutBtn" type="button">Logout</button>
        </section>`;
      $("logoutBtn").addEventListener("click", logout);
    }

    function closeSheet() {
      $("sheet").classList.add("hidden");
    }

    function render() {
      if (route === "dashboard") return renderDashboard();
      if (route === "canteens") return renderCanteens();
      if (route === "canteenDetail") return renderDetail();
      if (route === "add") return renderAdd();
      if (route === "approvals") return renderApprovals();
      if (route === "payments") return renderPayments();
      if (route === "team") return renderTeam();
      if (route === "reports") return renderReports();
      if (route === "profile") return renderProfile();
      return renderDashboard();
    }

    async function login(event) {
      event.preventDefault();
      $("loginStatus").className = "status";
      $("loginStatus").textContent = "Checking login...";
      try {
        setBusy(true);
        const body = await api("/marketing-api/login", {
          method: "POST",
          body: JSON.stringify({ employeeId: $("loginId").value.trim(), password: $("password").value })
        });
        token = body.token;
        user = body.user;
        localStorage.setItem(TOKEN_KEY, token);
        localStorage.setItem(USER_KEY, JSON.stringify(user));
        await refreshData({ silent: true });
        route = "dashboard";
        stack = [];
        $("loginScreen").classList.add("hidden");
        $("appScreen").classList.remove("hidden");
        render();
      } catch (error) {
        $("loginStatus").className = "status error";
        $("loginStatus").textContent = error.message;
      } finally {
        setBusy(false);
      }
    }

    function logout() {
      token = "";
      user = null;
      localStorage.removeItem(TOKEN_KEY);
      localStorage.removeItem(USER_KEY);
      $("appScreen").classList.add("hidden");
      $("loginScreen").classList.remove("hidden");
      stack = [];
    }

    document.querySelectorAll("[data-login-role]").forEach(btn => btn.addEventListener("click", () => {
      selectedLoginRole = btn.dataset.loginRole;
      document.querySelectorAll("[data-login-role]").forEach(item => item.classList.toggle("active", item === btn));
      $("loginId").value = selectedLoginRole === "manager" ? "SUPER" : "MKT001";
      $("password").value = selectedLoginRole === "manager" ? "admin123" : "1234";
      $("loginStatus").className = "status";
      $("loginStatus").textContent = selectedLoginRole === "manager" ? "Manager login: SUPER / admin123." : "Employee login: MKT001 / 1234.";
    }));

    $("loginForm").addEventListener("submit", login);
    $("backBtn").addEventListener("click", () => {
      route = stack.pop() || "dashboard";
      render();
    });
    $("refreshBtn").addEventListener("click", async () => {
      await refreshData();
      render();
    });
    $("sheet").addEventListener("click", event => {
      if (event.target.id === "sheet") closeSheet();
    });

    if (token && user) {
      $("loginScreen").classList.add("hidden");
      $("appScreen").classList.remove("hidden");
      refreshData({ silent: true }).finally(render);
    }
  </script>
</body>
</html>
