<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Axzen POS · Dine In preview</title><link rel="stylesheet" href="dine-in.css">
<style>
body{margin:0;background:#f4f6f8;color:#0c1532;font:14px 'Segoe UI',sans-serif}.preview-top{height:76px;padding:0 24px;display:flex;align-items:center;gap:24px;background:#fff;border-bottom:1px solid #e0e6ee}.preview-logo{font-size:31px;letter-spacing:-1.5px;font-weight:750;color:#096554}.preview-logo small{font-size:20px;color:#0c1532;letter-spacing:0;font-weight:500}.preview-location{border:1px solid #e0e6ee;border-radius:10px;padding:12px 20px}.preview-sync{color:#087448;background:#e0f7e8;padding:10px 18px;border-radius:24px}.preview-user{margin-left:auto;display:flex;align-items:center;gap:12px}.preview-avatar{display:grid;place-items:center;border-radius:50%;background:#126959;color:white;width:42px;height:42px}.preview-user small{display:block;color:#64718b;margin-top:3px}.preview-notice{margin:0;padding:6px 24px;background:#eaf6f0;font-size:11px;color:#45675c}.preview-notice a{float:right;color:#096554}#root{max-width:1920px;margin:auto}@media(max-width:760px){.preview-top{height:65px;padding:0 16px;gap:12px}.preview-logo{font-size:26px}.preview-logo small{font-size:16px}.preview-location{padding:8px;font-size:11px;margin-left:auto}.preview-sync,.preview-user{display:none}.preview-notice{padding:6px 16px;font-size:10px}}
</style></head><body>
<header class="preview-top"><div class="preview-logo">axzen <small>POS</small></div><div class="preview-location">⌖ &nbsp; Main Canteen &nbsp;⌄</div><span class="preview-sync">● &nbsp; Preview</span><div class="preview-user"><span class="preview-avatar">R</span><div><b>Ravi Kumar</b><small>Cashier</small></div></div></header>
<p class="preview-notice">Interactive sample · no live orders or payments. <a href="index.html">Open POS</a></p><main id="root"></main>
<script src="bill-taxes.js"></script><script src="dine-in.js"></script><script>
const photos={mushroom:'photo-1512621776951-a57141f2eefd',paneer:'photo-1565557623262-b51c2513a641',rice:'photo-1512058564366-18510be2db19',biryani:'photo-1563379091339-03246963d96c',naan:'photo-1601050690597-df0568f70950',lime:'photo-1513558161293-cdaf765edfd7'};
const menu=[['Chilli Mushroom',190,'Starters','mushroom'],['Paneer Tikka',220,'Starters','paneer'],['Veg Fried Rice',160,'Rice','rice'],['Veg Biryani',180,'Rice','biryani'],['Butter Naan',40,'Breads','naan'],['Fresh Lime',60,'Beverages','lime']].map(([name,price,category,pic],i)=>({id:i+1,name,price,category,image:`assets/dine-in-preview/${pic}.jpg`}));
const state={enabled:true,tables:Array.from({length:8},(_,i)=>({tableId:'t'+(i+1),name:String(i+1),zone:'Main Hall',seats:i===4?2:4,status:[0,1,2,6].includes(i)?'occupied':i===5?'reserved':'available',active:true,revision:0}))};
for(const [i,amount] of [[0,380],[1,540],[2,715],[6,260]])state.tables[i].session={id:'s'+i,guests:2,tickets:[{id:'k'+i,number:24+i,status:i===1?'ready':'preparing',createdAt:new Date().toISOString(),waiter:'Ravi',items:i===1?[{id:1,name:menu[0].name,price:190,qty:2},{id:3,name:menu[2].name,price:160,qty:1}]:[{id:1,name:'Table order',price:amount,qty:1}]}]};
state.tables[5].reservation='8:30 PM';const bills=[];
async function api(path,opts={}){
 const body=opts.body?JSON.parse(opts.body):{};const row=state.tables.find(t=>path.includes('/'+t.tableId+'/'));
 if(path==='/dine-in')return structuredClone(state);if(path==='/orders')return structuredClone(bills);
 if(path.endsWith('/tickets')){const duplicate=row.session?.tickets.find(t=>t.id===body.requestId);if(duplicate)return {table:row,ticket:duplicate,duplicate:true};const ticket={id:body.requestId,number:28+(row.session?.tickets.length||0),status:'new',createdAt:new Date().toISOString(),waiter:'Ravi',items:body.items};row.session||={id:'s'+Date.now(),guests:body.guests,tickets:[]};row.session.tickets.push(ticket);row.status='occupied';row.revision++;return {table:structuredClone(row),ticket};}
 if(path.includes('/tickets/')){row.session.tickets.find(t=>path.endsWith(t.id)).status=body.status;row.revision++;return {};}
 if(path.endsWith('/state')){row.status=body.status;row.reservation=body.reservation;return {};}
 if(path.endsWith('/settle')){const items=row.session.tickets.filter(t=>t.status!=='cancelled').flatMap(t=>t.items);const order={id:bills.length+1,clientOrderId:row.session.id,orderType:'Dine In',tableId:row.tableId,tableName:row.name,items,total:items.reduce((s,i)=>s+i.qty*i.price,0),payment:body.payment,time:new Date().toLocaleString()};bills.push(order);row.session=null;row.lastBill=order;row.status='cleaning';return {order};}
 throw Error('Action unavailable in sample');
}
const drafts={};DineIn.mount(document.getElementById('root'),{api,getMenu:async()=>menu,getDraft:id=>structuredClone(drafts[id]||null),saveDraft:(id,value)=>drafts[id]=structuredClone(value),printKot:()=> 'Sample ticket only.'});
if(innerWidth>=761){const observer=new MutationObserver(()=>{const table=document.querySelector('[data-di="select"][data-value="t2"]');if(table){observer.disconnect();table.click();}});observer.observe(document.getElementById('root'),{childList:true,subtree:true});}
</script></body></html>
