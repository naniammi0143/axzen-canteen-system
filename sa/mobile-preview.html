<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Axzen POS — Mobile Dine In Demo</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0f172a; color: #e2e8f0; font-family: system-ui, sans-serif; }
    .wrap { min-height: 100%; display: grid; place-items: center; padding: 16px; box-sizing: border-box; }
    .phone {
      width: min(390px, 100%);
      height: min(844px, calc(100vh - 32px));
      border: 10px solid #111827;
      border-radius: 28px;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 30px 80px #0008;
    }
    .phone iframe { width: 100%; height: 100%; border: 0; display: block; background: #fff; }
    .hint { margin-top: 12px; text-align: center; font-size: 13px; color: #94a3b8; max-width: 390px; }
    .hint a { color: #93c5fd; }
    @media (max-width: 480px) {
      .wrap { padding: 0; }
      .phone { width: 100%; height: 100vh; border: 0; border-radius: 0; box-shadow: none; }
      .hint { display: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div>
      <div class="phone">
        <iframe title="Axzen POS mobile demo" src="./dinein-demo-boot.html"></iframe>
      </div>
      <p class="hint">
        Mobile preview. Direct link:
        <a href="./dinein-demo-boot.html">/dinein-demo-boot.html</a>
      </p>
    </div>
  </div>
</body>
</html>
